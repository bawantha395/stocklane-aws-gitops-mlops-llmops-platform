name: Validate platform
on:
  workflow_dispatch:
  workflow_call:   # Deploy environment runs these checks first
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Pushes and PRs cancel older runs on the same branch; a deploy run gets its own group.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f services/inventory/pom.xml package -DskipTests
      - run: mvn -B -ntp -f services/workshop/pom.xml package -DskipTests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: python -m compileall -q mlops services models
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Kustomize and kubeconform (checksum pinned)
        run: |
          curl -fsSL -o /tmp/kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz
          echo "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61  /tmp/kustomize.tgz" | sha256sum -c -
          curl -fsSL -o /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/kustomize.tgz -C /usr/local/bin kustomize
          sudo tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform
      - name: Build every folder and check the schemas
        run: |
          for dir in kubernetes/environments/dev kubernetes/monitoring kubernetes/platform; do
            kustomize build "$dir"
          done | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.35.0 -summary -
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive infra
      - name: Validate every environment
        run: |
          for env in dev; do
            terraform -chdir=infra/terraform/environments/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/environments/$env validate
          done
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: pip install cfn-lint==1.58.0 shellcheck-py==0.11.0.1
      - name: Install actionlint (checksum pinned)
        run: |
          curl -fsSL -o /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tgz -C /usr/local/bin actionlint
      - run: actionlint -color=false
      - run: cfn-lint -i W2001 -t infra/ci/identity.json infra/ci/state.json
      - run: bash -n infra/ci/bootstrap.sh && shellcheck infra/ci/bootstrap.sh
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: '1'
