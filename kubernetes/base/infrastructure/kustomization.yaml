apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- serviceaccounts.yaml
- external-secrets.yaml
- networkpolicy.yaml
- ingress.yaml
- database-bootstrap-job.yaml
# Argo CD applies waves in order: config first (-3), then the database job (-2), then workloads.
patches:
- target: {kind: ServiceAccount}
  patch: |-
    - op: add
      path: /metadata/annotations
      value: {argocd.argoproj.io/sync-wave: '-3'}
- target: {kind: ExternalSecret}
  patch: |-
    - op: add
      path: /metadata/annotations
      value: {argocd.argoproj.io/sync-wave: '-3'}
- target: {kind: NetworkPolicy}
  patch: |-
    - op: add
      path: /metadata/annotations
      value: {argocd.argoproj.io/sync-wave: '-3'}
