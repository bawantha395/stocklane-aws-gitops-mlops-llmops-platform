apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vision-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: vision-secrets
    template:
      engineVersion: v2
