apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventory-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: inventory-secrets
    template:
      engineVersion: v2
      data:
        INVENTORY_READ_TOKEN: '{{ .INVENTORY_READ_TOKEN }}'
        INVENTORY_CONTROL_TOKEN: '{{ .INVENTORY_CONTROL_TOKEN }}'
        INTERNAL_TOKEN: '{{ .INTERNAL_TOKEN }}'
        REDIS_PASSWORD: '{{ .REDIS_PASSWORD }}'
        DATABASE_PASSWORD: '{{ .password }}'
        DATABASE_USER: '{{ .username }}'
        DATABASE_URL: jdbc:postgresql://{{ .host }}:5432/{{ .dbname }}?currentSchema=inventory&sslmode=verify-full&sslrootcert=/app/certs/rds-global-bundle.pem
  data:
  - secretKey: username
    remoteRef:
      key: stocklane-dev/inventory/database
      property: username
  - secretKey: password
    remoteRef:
      key: stocklane-dev/inventory/database
      property: password
  - secretKey: host
    remoteRef:
      key: stocklane-dev/inventory/database
      property: host
  - secretKey: dbname
    remoteRef:
      key: stocklane-dev/inventory/database
      property: dbname
  - secretKey: INTERNAL_TOKEN
    remoteRef:
      key: stocklane-dev/platform
      property: INTERNAL_TOKEN
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: stocklane-dev/platform
      property: REDIS_PASSWORD
  - secretKey: INVENTORY_READ_TOKEN
    remoteRef:
      key: stocklane-dev/platform
      property: INVENTORY_READ_TOKEN
  - secretKey: INVENTORY_CONTROL_TOKEN
    remoteRef:
      key: stocklane-dev/platform
      property: INVENTORY_CONTROL_TOKEN
---
