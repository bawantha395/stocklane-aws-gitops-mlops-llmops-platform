  data:
  - secretKey: username
    remoteRef:
      key: stocklane-dev/vision/database
      property: username
  - secretKey: password
    remoteRef:
      key: stocklane-dev/vision/database
      property: password
  - secretKey: host
    remoteRef:
      key: stocklane-dev/vision/database
      property: host
  - secretKey: dbname
    remoteRef:
      key: stocklane-dev/vision/database
      property: dbname
  - secretKey: INTERNAL_TOKEN
    remoteRef:
      key: stocklane-dev/platform
      property: INTERNAL_TOKEN
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: stocklane-dev/platform
      property: REDIS_PASSWORD
  - secretKey: INVENTORY_READ_TOKEN
    remoteRef:
      key: stocklane-dev/platform
      property: INVENTORY_READ_TOKEN
---
