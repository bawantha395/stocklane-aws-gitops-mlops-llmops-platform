apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
  - secretKey: admin-user
    remoteRef:
      key: stocklane-dev/grafana/admin
      property: username
  - secretKey: admin-password
    remoteRef:
      key: stocklane-dev/grafana/admin
      property: password
