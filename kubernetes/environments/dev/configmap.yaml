# Written by the Deploy workflow from the Terraform outputs. Public values only, secrets stay in Secrets Manager.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
data:
  AUTH_MODE: cognito
  ENVIRONMENT: cloud
  SPRING_PROFILES_ACTIVE: cloud
  AWS_REGION: "REPLACE_AWS_REGION"
  DEPLOYMENT_ENVIRONMENT: dev
  COGNITO_ISSUER: "REPLACE_COGNITO_ISSUER"
  COGNITO_CLIENT_IDS: "REPLACE_WEB_CLIENT_ID"
  APP_WEB_ORIGIN: "https://REPLACE_FRONTEND_HOST"
  WEB_ORIGIN: "https://REPLACE_FRONTEND_HOST"
  INVENTORY_URL: http://inventory:8081
  WORKSHOP_URL: http://workshop:8082
  VISION_URL: http://vision:8083
  STOCK_QUEUE_URL: "https://REPLACE_STOCK_QUEUE"
  CATALOGUE_QUEUE_URL: "https://REPLACE_CATALOGUE_QUEUE"
  EVENT_MODE: sqs
  REDIS_HOST: "REPLACE_CACHE_HOST"
  REDIS_TLS: "true"
  MEDIA_BUCKET: "REPLACE_MEDIA_BUCKET"
  MODEL_BUCKET: "REPLACE_MODEL_BUCKET"
  MODEL_DIR: /models/current
  MODEL_URI: "s3://REPLACE_MODEL_BUCKET/REPLACE_MODEL_KEY"
  MODEL_ARCHIVE_SHA256: "REPLACE_MODEL_ARCHIVE_SHA256"
  FILES_ROOT: /tmp/files
  BEDROCK_MODEL_ID: ""
  BEDROCK_REGION: ""
  BEDROCK_DAILY_REQUEST_LIMIT: "50"
  TEXTRACT_FALLBACK: "true"
  TRAINING_EXPORT: "true"
  DATABASE_HOST: "REPLACE_DATABASE_HOST"
  MASTER_SECRET_ARN: "REPLACE_MASTER_SECRET_ARN"
  DATABASE_SECRETS: '{"inventory":"stocklane-dev/inventory/database","workshop":"stocklane-dev/workshop/database","vision":"stocklane-dev/vision/database"}'
