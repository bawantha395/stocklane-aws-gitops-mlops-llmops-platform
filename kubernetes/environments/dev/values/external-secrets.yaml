# Pod Identity (Terraform) gives the external-secrets service account its AWS role.
installCRDs: true
serviceAccount:
  create: true
  name: external-secrets
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 192Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}
certController:
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 128Mi}
